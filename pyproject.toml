[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "evaluation: LLM/RAG evaluation tests that may call external model providers",
    "tools: deterministic tests for agent tool-calling behavior",
]
