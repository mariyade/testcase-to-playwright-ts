principles:
  - "Test observable behaviour."
  - "Focus coverage on business risk."
  - "Do not invent evidence, credentials, routes, selectors, or results."
  - "Keep browser E2E for business-critical guest and admin journeys."

risk_areas:
  - "booking_creation"
  - "booking_confirmation"
  - "contact_form_submission"
  - "form_validation"
  - "admin_room_management"
  - "visual_room_listing"

test_design:
  prefer:
    - "API assertions for booking contracts."
    - "Stable locators: role, label, placeholder, test id."
    - "Future booking dates generated by helpers."
    - "Page-object methods for shared UI flows."
  avoid:
    - "Hard waits."
    - "Brittle selectors."
    - "Assuming unavailable admin helpers exist."
    - "Using real customer data."

reporting:
  include:
    - "environment"
    - "preconditions"
    - "steps"
    - "expected"
    - "actual"
    - "risk"
