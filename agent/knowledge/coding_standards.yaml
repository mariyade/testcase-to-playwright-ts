coding_standards:
  generated_playwright_tests:
    - "Generated E2E specs are written to playwright/tests/generated/e2e/*.spec.ts."
    - "Generated visual specs are written to playwright/tests/generated/visual/*.visual.spec.ts."
    - "Generated API specs are written to playwright/tests/generated/api/*.spec.ts."
    - "From generated specs in a generated subfolder, import fixtures with: import { test, expect } from '../../../fixtures/test';"
    - "Prefer BookingPage for UI room booking flows."
    - "Prefer BookingApi for direct API verification of created bookings."
    - "Prefer custom fixtures from fixtures/test.ts when available."
    - "Use existing page-object methods and properties from provided context."
    - "Keep selectors and low-level Playwright interactions inside page objects."
    - "Do not invent page methods, fixture names, routes, selectors, credentials, or business rules."
    - "Do not call page.fill, page.click, page.locator, locator.fill, locator.click, or raw CSS/XPath selectors from generated specs unless those exact calls already appear in existing example specs."
    - "If a required page-object helper is missing, report it in missing_page_object_methods instead of calling it from generated code."
    - "Every generated test must include meaningful await expect(...) assertions."
    - "Do not generate placeholder tests with comments instead of executable actions and assertions."
    - "Use Playwright test details syntax with singular tag, for example { tag: '@e2e' }; do not use tags."
    - "Use async tests and await every Playwright or page-object action."
    - "Use future dates for bookings and keep checkout after checkin."
    - "Capture POST /api/booking responses when a UI flow creates a booking."
    - "Do not assert exact booking ids because the public demo data resets regularly."
    - "Assert visible UI confirmation and captured POST response data for end-to-end booking tests."
    - "Do not rely on GET /api/booking/{bookingid} for UI-created bookings unless a working API context is proven in the current environment."
    - "Generate admin-only tests only when the story explicitly provides admin credentials."
    - "Generate only guest or admin tests; the app has no other user role."
