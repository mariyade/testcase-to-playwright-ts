coding_standards:
  rules:
    - "Prefer page-object methods over raw locators."
    - "Reuse existing fixtures, page objects, helpers, and selectors."
    - "Only use page.locator() when no suitable page-object abstraction exists."
    - "Do not invent selectors, credentials, fixtures, routes, helper methods, or business rules."
    - "Every non-skipped test must contain meaningful actions and assertions."
    - "Every test must establish its own required page state."
    - "Use exactly one Playwright tag per test."
    - "Do not put tags in test titles."
    - "Use the Playwright request fixture or request.newContext() for API tests."

playwright_file_organization:
  grouping_rule: "Group generated tests by page or business flow."
  describe_blocks: "Use test.describe('<Page or flow>', () => { ... }) when multiple related tests live in one file."
  avoid:
    - "Do not add comments that merely restate the TestSpec test case id or title."
    - "Do not update visual snapshot baselines from generated code."
