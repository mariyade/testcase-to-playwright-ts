business_rules:
  public_room_browsing:
    actor: "guest"
    starts_on: "home_page"
    expected:
      - "Guest can see the room list."
      - "Room cards show room type, facilities, price, and booking action."

  guest_booking:
    actor: "guest"
    required_fields:
      - "first name"
      - "last name"
      - "email"
      - "phone"
      - "check-in date"
      - "check-out date"
    success:
      - "Booking request returns a booking id."
      - "Confirmation is shown to the guest."
    constraints:
      - "Use future check-in and check-out dates."
      - "Do not assume overlapping booking support unless a helper exists."

  contact_form:
    actor: "guest"
    required_fields:
      - "name"
      - "email"
      - "phone"
      - "subject"
      - "message"
    success: "Guest sees a confirmation after submitting a valid message."
    validation:
      - "Missing required fields should show validation feedback."
      - "Invalid email format should show validation feedback."

  admin_rooms:
    actor: "admin"
    credentials: "Use only when explicitly supplied by the requirement."
    expected:
      - "Admin can view configured rooms."
      - "Admin can review room details and admin navigation."
