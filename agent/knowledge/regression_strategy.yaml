regression:
  api_health_checks:
    - "POST /api/booking"
    - "GET /api/booking/{bookingId}"
    - "POST /api/message"

  e2e_core_flows:
    - "Guest can browse room cards."
    - "Guest can create a room booking with valid details."
    - "Guest can send a contact message."
    - "Guest receives validation feedback for invalid form input."
    - "Admin can view the rooms dashboard when credentials are supplied."

  visual:
    breakpoints:
      desktop: "1440x900"
      tablet: "768x1024"
      mobile: "390x844"
    run_when:
      - "Story mentions visual, layout, responsive behaviour, overflow, clipping, spacing, fonts, dark mode, or RTL."

generated_test_rules:
  tags:
    smoke: "{ tag: '@smoke' }"
    e2e: "{ tag: '@e2e' }"
    visual: "{ tag: '@visual' }"
  avoid:
    - "Hard waits."
    - "Updating screenshot baselines from generated code."
    - "Inventing admin credentials unless the requirement provides them."
