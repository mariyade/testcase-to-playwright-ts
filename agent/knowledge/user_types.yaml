user_types:
  guest:
    auth: "none"
    can:
      - "View public room information."
      - "Create a booking when valid room, date, and guest data are provided."
      - "Submit the public contact form."
    cannot:
      - "Access admin-only room management without credentials."

  admin:
    auth: "username and password when explicitly supplied by the requirement"
    can:
      - "View the admin dashboard."
      - "Review rooms, reports, branding, messages, and front-page admin navigation."
    constraints:
      - "Do not create, edit, or delete rooms unless the requirement explicitly asks for mutation."
