navigation_flows:
  browse_rooms:
    user_type: "guest"
    starts_from: "/"
    steps:
      - "Open the home page."
      - "Review the Our Rooms section."
    assertions:
      - "Room cards are visible."
      - "Room prices and facilities are visible when provided by the requirement."

  create_booking:
    user_type: "guest"
    starts_from: "/reservation/{roomId}"
    steps:
      - "Open the reservation page for a room and date range."
      - "Open the reservation form."
      - "Fill guest details."
      - "Submit the booking."
    assertions:
      - "Booking API responds successfully."
      - "Booking confirmation is displayed."

  send_contact_message:
    user_type: "guest"
    starts_from: "/"
    steps:
      - "Open the home page."
      - "Fill the contact form."
      - "Submit the contact form."
    assertions:
      - "A success or validation message is shown according to the submitted data."

  admin_rooms_dashboard:
    user_type: "admin"
    starts_from: "/admin"
    assertions:
      - "Admin dashboard is visible after login."
      - "Room records and admin navigation are visible."
