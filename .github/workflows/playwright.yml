name: Playwright E2E

on:
  workflow_dispatch:
    inputs:
      run_visual:
        description: "Run visual regression snapshots"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: playwright/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: playwright

      - name: Run generated smoke E2E
        run: npm run test:smoke
        working-directory: playwright

      - name: Run generated visual regression
        if: inputs.run_visual == 'true'
        run: npm run test:regression:visual
        working-directory: playwright

      - name: Run generated regression E2E
        run: npm run test:regression:e2e
        working-directory: playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
