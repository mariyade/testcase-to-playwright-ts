default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: playwright-eslint
        name: playwright eslint
        entry: npm --prefix playwright run lint
        language: system
        pass_filenames: false
        files: ^playwright/.*\.ts$
      - id: playwright-typecheck
        name: playwright typecheck
        entry: npm --prefix playwright run typecheck
        language: system
        pass_filenames: false
        files: ^playwright/.*\.ts$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            feat,
            fix,
            test,
            refactor,
            docs,
            chore,
            ci,
            style,
            perf,
            build,
          ]
